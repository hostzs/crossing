name: Update AI Rules

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

jobs:

  update-ai:

    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 2. 获取 Mihomo 最新稳定版本
      # ========================================

      - name: Get latest Mihomo version
        id: mihomo
        run: |

          set -e

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION=$(curl -fsSL "$API" \
            | grep '"tag_name":' \
            | head -1 \
            | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "无法获取 Mihomo 最新版本"
            exit 1
          fi

          echo "Mihomo 最新稳定版：$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ========================================
      # 3. 安装 Mihomo
      # ========================================

      - name: Install latest stable Mihomo
        run: |

          set -e

          VERSION="${{ steps.mihomo.outputs.version }}"

          FILE="mihomo-linux-amd64-v1-${VERSION}.gz"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${FILE}"

          echo "========================================"
          echo "安装 Mihomo"
          echo "========================================"
          echo

          echo "版本：$VERSION"
          echo "文件：$FILE"
          echo

          wget -q --show-progress "$URL"

          gunzip "$FILE"

          BINARY="${FILE%.gz}"

          chmod +x "$BINARY"

          sudo mv "$BINARY" /usr/local/bin/mihomo

          echo
          echo "安装完成："

          mihomo -v

      # ========================================
      # 4. 构建 AI 规则
      # ========================================

      - name: Build AI rules
        run: |

          set -e

          chmod +x scripts/build-ai.sh

          ./scripts/build-ai.sh

      # ========================================
      # 5. 检查是否真的有变化
      # ========================================

      - name: Check generated files
        id: generated
        run: |

          set -e

          echo "========================================"
          echo "检查 AI 规则变化"
          echo "========================================"

          if git diff --quiet -- \
              output/AI.list \
              output/AI.yaml \
              output/AI.mrs
          then

            echo "AI 规则没有变化"

            echo "commit=false" >> "$GITHUB_OUTPUT"

          else

            echo "AI 规则发生变化"

            git diff --stat -- \
              output/AI.list \
              output/AI.yaml \
              output/AI.mrs

            echo "commit=true" >> "$GITHUB_OUTPUT"

          fi

      # ========================================
      # 6. 提交
      # ========================================

      - name: Commit changes
        if: steps.generated.outputs.commit == 'true'
        run: |

          set -e

          echo "========================================"
          echo "提交 AI 规则"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/AI.list \
            output/AI.yaml \
            output/AI.mrs

          if git diff --cached --quiet; then

            echo "没有需要提交的内容"

          else

            git commit -m "update AI rules"

            git push

          fi

      # ========================================
      # 7. 没有变化
      # ========================================

      - name: No changes
        if: steps.generated.outputs.commit == 'false'
        run: |

          echo "========================================"
          echo "AI 规则没有变化"
          echo "========================================"

          echo
          echo "跳过提交"
