name: Update Proxy and Direct Rules

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. 获取 Mihomo 最新稳定版本
      # ========================================

      - name: Get latest Mihomo version
        id: mihomo
        run: |
          set -e

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION=$(curl -fsSL "$API" \
            | grep '"tag_name":' \
            | head -1 \
            | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "无法获取 Mihomo 最新版本"
            exit 1
          fi

          echo "Mihomo 最新稳定版：$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ========================================
      # 3. 检查规则和 Mihomo 是否发生变化
      # ========================================

      - name: Check changes
        id: check
        run: |
          set -e

          PROXY_SOURCE="sources/manual-proxy.list"
          DIRECT_SOURCE="sources/manual-direct.list"

          DIRECT_URL="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"

          PROXY_OUTPUT="output/proxy.yaml"
          DIRECT_OUTPUT="output/direct.yaml"

          VERSION_FILE="output/.mihomo-version"


          echo "========================================"
          echo "检查更新"
          echo "========================================"
          echo


          # ========================================
          # Proxy SHA256
          # ========================================

          PROXY_HASH=$(sha256sum "$PROXY_SOURCE" \
            | awk '{print $1}')


          # ========================================
          # Direct 本地 SHA256
          # ========================================

          DIRECT_LOCAL_HASH=$(sha256sum "$DIRECT_SOURCE" \
            | awk '{print $1}')


          # ========================================
          # 下载 Loyalsoldier direct.txt
          # ========================================

          echo "下载 Loyalsoldier direct.txt..."

          curl -fsSL \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            "$DIRECT_URL" \
            -o /tmp/direct.txt


          DIRECT_REMOTE_HASH=$(sha256sum /tmp/direct.txt \
            | awk '{print $1}')


          # ========================================
          # Direct 综合 SHA256
          # ========================================

          DIRECT_HASH=$(
            {
              printf '%s  %s\n' \
                "$DIRECT_LOCAL_HASH" \
                "$DIRECT_SOURCE"

              printf '%s  %s\n' \
                "$DIRECT_REMOTE_HASH" \
                "$DIRECT_URL"

            } | sha256sum | awk '{print $1}'
          )


          # ========================================
          # 读取旧 HASH
          # ========================================

          OLD_PROXY_HASH=$(
            grep "^# SOURCE-SHA256:" "$PROXY_OUTPUT" 2>/dev/null \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          OLD_DIRECT_HASH=$(
            grep "^# SOURCE-SHA256:" "$DIRECT_OUTPUT" 2>/dev/null \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          # ========================================
          # Mihomo
          # ========================================

          CURRENT_VERSION="${{ steps.mihomo.outputs.version }}"

          OLD_VERSION=$(cat "$VERSION_FILE" 2>/dev/null || true)


          echo "Proxy 当前 SHA256："
          echo "$PROXY_HASH"
          echo

          echo "Proxy 旧 SHA256："
          echo "$OLD_PROXY_HASH"
          echo

          echo "Direct 本地 SHA256："
          echo "$DIRECT_LOCAL_HASH"
          echo

          echo "Direct 远程 SHA256："
          echo "$DIRECT_REMOTE_HASH"
          echo

          echo "Direct 综合 SHA256："
          echo "$DIRECT_HASH"
          echo

          echo "Direct 旧 SHA256："
          echo "$OLD_DIRECT_HASH"
          echo

          echo "当前 Mihomo："
          echo "$CURRENT_VERSION"
          echo

          echo "旧 Mihomo："
          echo "$OLD_VERSION"
          echo


          # ========================================
          # 判断
          # ========================================

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "手动运行，强制生成"

            echo "changed=true" >> "$GITHUB_OUTPUT"


          elif [ "$PROXY_HASH" != "$OLD_PROXY_HASH" ]; then

            echo "manual-proxy.list 有变化"

            echo "changed=true" >> "$GITHUB_OUTPUT"


          elif [ "$DIRECT_HASH" != "$OLD_DIRECT_HASH" ]; then

            echo "Direct 规则有变化"

            echo "changed=true" >> "$GITHUB_OUTPUT"


          elif [ "$CURRENT_VERSION" != "$OLD_VERSION" ]; then

            echo "Mihomo 有新版本"

            echo "changed=true" >> "$GITHUB_OUTPUT"


          else

            echo "规则和 Mihomo 都没有变化"

            echo "无需重新生成"

            echo "changed=false" >> "$GITHUB_OUTPUT"

          fi


      # ========================================
      # 4. 安装最新稳定版 Mihomo
      # ========================================

      - name: Install latest stable Mihomo
        if: steps.check.outputs.changed == 'true'
        run: |
          set -e

          VERSION="${{ steps.mihomo.outputs.version }}"

          FILE="mihomo-linux-amd64-v1-${VERSION}.gz"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${FILE}"

          echo "========================================"
          echo "安装 Mihomo"
          echo "========================================"
          echo
          echo "版本：$VERSION"
          echo "文件：$FILE"
          echo

          wget -q --show-progress "$URL"

          gunzip "$FILE"

          BINARY="${FILE%.gz}"

          chmod +x "$BINARY"

          sudo mv "$BINARY" /usr/local/bin/mihomo

          echo
          echo "安装完成："

          mihomo -v


      # ========================================
      # 5. 构建 Proxy + Direct
      # ========================================

      - name: Build proxy and direct rules
        if: steps.check.outputs.changed == 'true'
        run: |
          set -e

          chmod +x scripts/build.sh

          ./scripts/build.sh


      # ========================================
      # 6. 保存 Mihomo 版本
      # ========================================

      - name: Save Mihomo version
        if: steps.check.outputs.changed == 'true'
        run: |
          set -e

          echo "${{ steps.mihomo.outputs.version }}" \
            > output/.mihomo-version

          echo "保存 Mihomo 版本："

          cat output/.mihomo-version


      # ========================================
      # 7. 判断是否真正需要提交
      # ========================================

      - name: Check generated files
        if: steps.check.outputs.changed == 'true'
        id: generated
        run: |
          set -e

          PROXY_SOURCE="sources/manual-proxy.list"
          DIRECT_SOURCE="sources/manual-direct.list"

          DIRECT_URL="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"

          PROXY_OUTPUT="output/proxy.yaml"
          DIRECT_OUTPUT="output/direct.yaml"

          VERSION_FILE="output/.mihomo-version"


          # ========================================
          # 当前 Proxy HASH
          # ========================================

          CURRENT_PROXY_HASH=$(
            sha256sum "$PROXY_SOURCE" \
              | awk '{print $1}'
          )


          # ========================================
          # 当前 Direct HASH
          # ========================================

          CURRENT_DIRECT_LOCAL_HASH=$(
            sha256sum "$DIRECT_SOURCE" \
              | awk '{print $1}'
          )


          curl -fsSL \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            "$DIRECT_URL" \
            -o /tmp/direct-check.txt


          CURRENT_DIRECT_REMOTE_HASH=$(
            sha256sum /tmp/direct-check.txt \
              | awk '{print $1}'
          )


          CURRENT_DIRECT_HASH=$(
            {
              printf '%s  %s\n' \
                "$CURRENT_DIRECT_LOCAL_HASH" \
                "$DIRECT_SOURCE"

              printf '%s  %s\n' \
                "$CURRENT_DIRECT_REMOTE_HASH" \
                "$DIRECT_URL"

            } | sha256sum | awk '{print $1}'
          )


          # ========================================
          # Git HEAD 中的旧 HASH
          # ========================================

          OLD_PROXY_HASH=$(
            git show HEAD:"$PROXY_OUTPUT" 2>/dev/null \
              | grep "^# SOURCE-SHA256:" \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          OLD_DIRECT_HASH=$(
            git show HEAD:"$DIRECT_OUTPUT" 2>/dev/null \
              | grep "^# SOURCE-SHA256:" \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          CURRENT_VERSION="${{ steps.mihomo.outputs.version }}"


          OLD_VERSION=$(
            git show HEAD:"$VERSION_FILE" 2>/dev/null \
              || true
          )


          echo "========================================"
          echo "检查生成结果"
          echo "========================================"
          echo

          echo "Proxy 当前 SHA256："
          echo "$CURRENT_PROXY_HASH"
          echo

          echo "Proxy 旧 SHA256："
          echo "$OLD_PROXY_HASH"
          echo

          echo "Direct 当前 SHA256："
          echo "$CURRENT_DIRECT_HASH"
          echo

          echo "Direct 旧 SHA256："
          echo "$OLD_DIRECT_HASH"
          echo

          echo "当前 Mihomo："
          echo "$CURRENT_VERSION"
          echo

          echo "旧 Mihomo："
          echo "$OLD_VERSION"
          echo


          # ========================================
          # 判断
          # ========================================

          if [ "$CURRENT_PROXY_HASH" = "$OLD_PROXY_HASH" ] && \
             [ "$CURRENT_DIRECT_HASH" = "$OLD_DIRECT_HASH" ] && \
             [ "$CURRENT_VERSION" = "$OLD_VERSION" ]; then

            echo "规则和 Mihomo 都没有变化"
            echo "本次变化只能来自 UPDATED"
            echo "不提交"

            echo "commit=false" >> "$GITHUB_OUTPUT"

          else

            echo "检测到规则或 Mihomo 发生变化"

            echo "允许提交"

            echo "commit=true" >> "$GITHUB_OUTPUT"

          fi


      # ========================================
      # 8. 提交
      # ========================================

      - name: Commit changes
        if: steps.check.outputs.changed == 'true' && steps.generated.outputs.commit == 'true'
        run: |
          set -e

          echo "========================================"
          echo "提交生成结果"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            output/proxy.yaml \
            output/proxy.list \
            output/proxy.mrs \
            output/direct.yaml \
            output/direct.list \
            output/direct.mrs \
            output/.mihomo-version


          if git diff --cached --quiet; then

            echo "生成结果没有变化，不需要提交"

          else

            git commit -m "update proxy and direct rules"

            git push

          fi


      # ========================================
      # 9. 没有变化
      # ========================================

      - name: No changes
        if: steps.check.outputs.changed == 'false'
        run: |
          echo "========================================"
          echo "无需更新"
          echo "========================================"
          echo
          echo "Proxy 规则没有变化"
          echo "Direct 规则没有变化"
          echo "Mihomo 没有变化"
          echo
          echo "跳过构建"
          echo "跳过提交"
