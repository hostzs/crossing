name: Update Proxy Rules

on:
  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source changes
        id: check
        run: |
          SOURCE="sources/manual-proxy.list"
          OUTPUT="output/proxy.yaml"

          CURRENT_HASH=$(sha256sum "$SOURCE" | awk '{print $1}')

          OLD_HASH=$(grep "^# SOURCE-SHA256:" "$OUTPUT" 2>/dev/null \
            | sed 's/^# SOURCE-SHA256: //' \
            || true)

          echo "当前 SHA256：$CURRENT_HASH"
          echo "旧 SHA256：$OLD_HASH"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动运行，强制生成"
            echo "changed=true" >> "$GITHUB_OUTPUT"

          elif [ "$CURRENT_HASH" != "$OLD_HASH" ]; then
            echo "manual-proxy.list 有变化"
            echo "changed=true" >> "$GITHUB_OUTPUT"

          else
            echo "manual-proxy.list 没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build proxy rules
        if: steps.check.outputs.changed == 'true'
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Commit changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/proxy.yaml output/proxy.list

          if git diff --cached --quiet; then
            echo "生成结果没有变化，不需要提交"
          else
            git commit -m "update proxy rules"
            git push
          fi
