name: Update Proxy and Direct Rules

on:

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      ########################################
      # Checkout
      ########################################

      - name: Checkout
        uses: actions/checkout@v4


      ########################################
      # Get latest Mihomo
      ########################################

      - name: Get latest Mihomo version
        id: mihomo
        run: |

          set -e

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION=$(curl -fsSL "$API" \
            | grep '"tag_name":' \
            | head -1 \
            | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "无法获取 Mihomo 最新版本"
            exit 1
          fi

          echo "Mihomo 最新稳定版：$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      ########################################
      # Download Direct source and calculate hashes
      ########################################

      - name: Check source changes
        id: check
        run: |

          set -e

          PROXY_SOURCE="sources/manual-proxy.list"
          DIRECT_LOCAL_SOURCE="sources/manual-direct.list"

          DIRECT_REMOTE_URL="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"

          PROXY_OUTPUT="output/proxy.yaml"
          DIRECT_OUTPUT="output/direct.yaml"

          VERSION_FILE="output/.mihomo-version"


          echo "========================================"
          echo "检查规则源"
          echo "========================================"
          echo


          ####################################
          # Proxy hash
          ####################################

          CURRENT_PROXY_HASH=$(
            sha256sum "$PROXY_SOURCE" \
              | awk '{print $1}'
          )


          ####################################
          # Direct local hash
          ####################################

          CURRENT_DIRECT_LOCAL_HASH=$(
            sha256sum "$DIRECT_LOCAL_SOURCE" 2>/dev/null \
              | awk '{print $1}' \
              || true
          )

          if [ -z "$CURRENT_DIRECT_LOCAL_HASH" ]; then
            CURRENT_DIRECT_LOCAL_HASH="EMPTY"
          fi


          ####################################
          # Download remote Direct
          ####################################

          TMP_REMOTE=$(mktemp)

          trap 'rm -f "$TMP_REMOTE"' EXIT

          curl -fsSL \
            "$DIRECT_REMOTE_URL" \
            -o "$TMP_REMOTE"


          CURRENT_DIRECT_REMOTE_HASH=$(
            sha256sum "$TMP_REMOTE" \
              | awk '{print $1}'
          )


          ####################################
          # Combined Direct hash
          ####################################

          CURRENT_DIRECT_HASH=$(
            printf '%s\n' \
              "$CURRENT_DIRECT_LOCAL_HASH" \
              "$CURRENT_DIRECT_REMOTE_HASH" \
              | sha256sum \
              | awk '{print $1}'
          )


          ####################################
          # Read old hashes
          ####################################

          OLD_PROXY_HASH=$(
            grep "^# SOURCE-SHA256:" "$PROXY_OUTPUT" 2>/dev/null \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          OLD_DIRECT_HASH=$(
            grep "^# SOURCE-SHA256:" "$DIRECT_OUTPUT" 2>/dev/null \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          ####################################
          # Mihomo
          ####################################

          CURRENT_VERSION="${{ steps.mihomo.outputs.version }}"

          OLD_VERSION=$(
            cat "$VERSION_FILE" 2>/dev/null \
              || true
          )


          ####################################
          # Show information
          ####################################

          echo "Proxy："
          echo "  当前：$CURRENT_PROXY_HASH"
          echo "  旧：  $OLD_PROXY_HASH"

          echo

          echo "Direct local："
          echo "  当前：$CURRENT_DIRECT_LOCAL_HASH"

          echo

          echo "Direct remote："
          echo "  当前：$CURRENT_DIRECT_REMOTE_HASH"

          echo

          echo "Direct combined："
          echo "  当前：$CURRENT_DIRECT_HASH"
          echo "  旧：  $OLD_DIRECT_HASH"

          echo

          echo "Mihomo："
          echo "  当前：$CURRENT_VERSION"
          echo "  旧：  $OLD_VERSION"

          echo


          ####################################
          # Decide whether build is needed
          ####################################

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "手动运行"
            echo "强制构建"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          elif [ "$CURRENT_PROXY_HASH" != "$OLD_PROXY_HASH" ]; then

            echo "manual-proxy.list 有变化"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          elif [ "$CURRENT_DIRECT_HASH" != "$OLD_DIRECT_HASH" ]; then

            echo "Direct 规则有变化"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          elif [ "$CURRENT_VERSION" != "$OLD_VERSION" ]; then

            echo "Mihomo 有新版本"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          else

            echo "规则和 Mihomo 都没有变化"

            echo "changed=false" >> "$GITHUB_OUTPUT"

          fi


          ####################################
          # Export hashes
          ####################################

          echo "proxy_hash=$CURRENT_PROXY_HASH" >> "$GITHUB_OUTPUT"

          echo "direct_hash=$CURRENT_DIRECT_HASH" >> "$GITHUB_OUTPUT"

          echo "direct_remote_hash=$CURRENT_DIRECT_REMOTE_HASH" >> "$GITHUB_OUTPUT"


      ########################################
      # Install Mihomo
      ########################################

      - name: Install latest stable Mihomo
        if: steps.check.outputs.changed == 'true'
        run: |

          set -e

          VERSION="${{ steps.mihomo.outputs.version }}"

          FILE="mihomo-linux-amd64-v1-${VERSION}.gz"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${FILE}"


          echo "========================================"
          echo "安装 Mihomo"
          echo "========================================"
          echo

          echo "版本：$VERSION"
          echo "文件：$FILE"
          echo "URL：$URL"
          echo


          wget -q --show-progress "$URL"

          gunzip "$FILE"

          BINARY="${FILE%.gz}"

          chmod +x "$BINARY"

          sudo mv "$BINARY" /usr/local/bin/mihomo


          echo
          echo "安装完成："

          mihomo -v


      ########################################
      # Build
      ########################################

      - name: Build proxy and direct rules
        if: steps.check.outputs.changed == 'true'
        run: |

          set -e

          chmod +x scripts/build.sh

          ./scripts/build.sh


      ########################################
      # Save Mihomo version
      ########################################

      - name: Save Mihomo version
        if: steps.check.outputs.changed == 'true'
        run: |

          set -e

          echo "${{ steps.mihomo.outputs.version }}" \
            > output/.mihomo-version


          echo "保存 Mihomo 版本："

          cat output/.mihomo-version


      ########################################
      # Check generated result
      ########################################

      - name: Check generated files
        if: steps.check.outputs.changed == 'true'
        id: generated
        run: |

          set -e

          PROXY_SOURCE="sources/manual-proxy.list"

          DIRECT_LOCAL_SOURCE="sources/manual-direct.list"

          DIRECT_REMOTE_URL="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"

          PROXY_OUTPUT="output/proxy.yaml"

          DIRECT_OUTPUT="output/direct.yaml"

          VERSION_FILE="output/.mihomo-version"


          echo "========================================"
          echo "检查生成结果"
          echo "========================================"
          echo


          ####################################
          # Current hashes
          ####################################

          CURRENT_PROXY_HASH=$(
            sha256sum "$PROXY_SOURCE" \
              | awk '{print $1}'
          )


          CURRENT_DIRECT_LOCAL_HASH=$(
            sha256sum "$DIRECT_LOCAL_SOURCE" 2>/dev/null \
              | awk '{print $1}' \
              || true
          )

          if [ -z "$CURRENT_DIRECT_LOCAL_HASH" ]; then
            CURRENT_DIRECT_LOCAL_HASH="EMPTY"
          fi


          TMP_REMOTE=$(mktemp)

          trap 'rm -f "$TMP_REMOTE"' EXIT

          curl -fsSL \
            "$DIRECT_REMOTE_URL" \
            -o "$TMP_REMOTE"


          CURRENT_DIRECT_REMOTE_HASH=$(
            sha256sum "$TMP_REMOTE" \
              | awk '{print $1}'
          )


          CURRENT_DIRECT_HASH=$(
            printf '%s\n' \
              "$CURRENT_DIRECT_LOCAL_HASH" \
              "$CURRENT_DIRECT_REMOTE_HASH" \
              | sha256sum \
              | awk '{print $1}'
          )


          ####################################
          # Old hashes from git
          ####################################

          OLD_PROXY_HASH=$(
            git show HEAD:"$PROXY_OUTPUT" 2>/dev/null \
              | grep "^# SOURCE-SHA256:" \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          OLD_DIRECT_HASH=$(
            git show HEAD:"$DIRECT_OUTPUT" 2>/dev/null \
              | grep "^# SOURCE-SHA256:" \
              | sed 's/^# SOURCE-SHA256: //' \
              || true
          )


          CURRENT_VERSION="${{ steps.mihomo.outputs.version }}"


          OLD_VERSION=$(
            git show HEAD:"$VERSION_FILE" 2>/dev/null \
              || true
          )


          ####################################
          # Show
          ####################################

          echo "Proxy："
          echo "  当前：$CURRENT_PROXY_HASH"
          echo "  旧：  $OLD_PROXY_HASH"

          echo

          echo "Direct："
          echo "  当前：$CURRENT_DIRECT_HASH"
          echo "  旧：  $OLD_DIRECT_HASH"

          echo

          echo "Mihomo："
          echo "  当前：$CURRENT_VERSION"
          echo "  旧：  $OLD_VERSION"

          echo


          ####################################
          # Decide commit
          ####################################

          if [ "$CURRENT_PROXY_HASH" = "$OLD_PROXY_HASH" ] && \
             [ "$CURRENT_DIRECT_HASH" = "$OLD_DIRECT_HASH" ] && \
             [ "$CURRENT_VERSION" = "$OLD_VERSION" ]; then

            echo "规则和 Mihomo 都没有变化"
            echo "本次仅可能是 UPDATED 时间变化"
            echo "不提交"

            echo "commit=false" >> "$GITHUB_OUTPUT"

          else

            echo "规则或 Mihomo 发生变化"

            echo "允许提交"

            echo "commit=true" >> "$GITHUB_OUTPUT"

          fi


      ########################################
      # Commit
      ########################################

      - name: Commit changes
        if: steps.check.outputs.changed == 'true' && steps.generated.outputs.commit == 'true'
        run: |

          set -e

          echo "========================================"
          echo "提交生成结果"
          echo "========================================"


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            output/proxy.yaml \
            output/proxy.list \
            output/proxy.mrs \
            output/direct.yaml \
            output/direct.list \
            output/direct.mrs \
            output/.mihomo-version


          if git diff --cached --quiet; then

            echo "生成结果没有变化"
            echo "不需要提交"

          else

            git commit \
              -m "update proxy and direct rules"

            git push

          fi


      ########################################
      # No changes
      ########################################

      - name: No changes
        if: steps.check.outputs.changed == 'false'
        run: |

          echo "========================================"
          echo "无需更新"
          echo "========================================"
          echo

          echo "Proxy 规则没有变化"
          echo "Direct 规则没有变化"
          echo "Mihomo 没有变化"

          echo

          echo "跳过构建"
          echo "跳过提交"
